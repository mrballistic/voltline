[package]
name = "voltline"
version = "0.0.0" # unused: the app version comes from ../package.json via tauri.conf.json
description = "Voltline, a neon match-three game"
authors = ["Todd Greco"]
license = "MIT"
repository = "https://github.com/mrballistic/voltline"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
