# Apache vhost for Voltline: BOOTSTRAP version (port 80 only, no SSL refs).
#
# Ship this file FIRST. Once Apache reloads cleanly, issue the certificate
# with certbot's webroot plugin, then install the 443 vhost:
#
#   sudo a2enmod ssl headers rewrite
#   sudo cp deploy/apache-voltline.conf /etc/apache2/sites-available/voltline.conf
#   sudo a2ensite voltline
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot certonly --webroot -w /var/www/voltline -d voltline.mrballistic.com
#   sudo cp deploy/apache-voltline-le-ssl.conf /etc/apache2/sites-available/voltline-le-ssl.conf
#   sudo a2ensite voltline-le-ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The webroot plugin answers the HTTP-01 challenge by writing a file under
# /var/www/voltline/.well-known/acme-challenge/, served through this port-80
# vhost, and it never edits Apache config. Renewals (certbot's timer) work the
# same way, so the deploy's rsync excludes /.well-known/. Don't pre-bake the
# 443 block here: configtest fails before the certificate exists.

<VirtualHost *:80>
    ServerName voltline.mrballistic.com
    DocumentRoot /var/www/voltline

    ErrorLog  ${APACHE_LOG_DIR}/voltline-error.log
    CustomLog ${APACHE_LOG_DIR}/voltline-access.log combined

    <Directory /var/www/voltline>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Everything redirects to https except Let's Encrypt's HTTP-01 challenge,
    # which must stay reachable over plain http for issuance and renewal.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://voltline.mrballistic.com/$1 [R=301,L]

    # HSTS is added on the 443 vhost only; never send it over plain http.
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>

# DO NOT add a <VirtualHost *:443> block here; it lives in
# apache-voltline-le-ssl.conf, installed after the certificate is issued.
