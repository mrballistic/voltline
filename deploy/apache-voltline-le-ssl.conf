# Apache 443 vhost for Voltline (static files only, no proxy).
#
# certbot --apache generates a 443 vhost by copying the port-80 one and adding
# SSL directives. Because the port-80 vhost is a redirect, the generated one is
# a redirect too, which loops https -> https. This file is the fully fleshed
# vhost you actually want.
#
# Install (after certbot has issued the certificate):
#   sudo cp deploy/apache-voltline-le-ssl.conf /etc/apache2/sites-available/voltline-le-ssl.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# sites-enabled/voltline-le-ssl.conf is already a symlink to sites-available
# after certbot ran, so no a2ensite is needed. Needs mod_headers and mod_rewrite.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName voltline.mrballistic.com
    DocumentRoot /var/www/voltline

    ErrorLog  ${APACHE_LOG_DIR}/voltline-error.log
    CustomLog ${APACHE_LOG_DIR}/voltline-access.log combined

    <Directory /var/www/voltline>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Single-page fallback: unknown paths serve the app shell.
        FallbackResource /index.html
    </Directory>

    # A missing hashed bundle or sound must 404, not fall back to index.html:
    # a stale tab would otherwise get HTML for a JS module, and a missing
    # sound would "load" as HTML instead of degrading to silence.
    <Directory /var/www/voltline/assets>
        FallbackResource disabled
    </Directory>
    <Directory /var/www/voltline/audio>
        FallbackResource disabled
    </Directory>

    # Audio is served with the right MIME types for the browser's decoder.
    AddType audio/webm .webm
    AddType audio/mp4 .m4a

    # Hashed bundles and the encoded sounds never change under the same name,
    # so cache them for a year. Matched by file extension, never by URL, so a
    # fallback response (HTML) can't pick up the immutable header. index.html
    # stays uncached so a new deploy is picked up immediately.
    <FilesMatch "\.(?:js|css|woff2?|svg|png|jpg|webp|webm|m4a)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    # Defense-in-depth headers. The CSP matches the desktop (Tauri) app's.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:"

    # certbot manages these.
    SSLCertificateFile /etc/letsencrypt/live/voltline.mrballistic.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/voltline.mrballistic.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
