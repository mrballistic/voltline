# Apache 443 vhost for Voltline (static files only, no proxy).
#
# The certificate is issued with certbot's webroot plugin, which writes its
# HTTP-01 challenge under /var/www/voltline/.well-known/ and never edits Apache
# config (see apache-voltline.conf for the order).
#
# Install (after certbot has issued the certificate):
#   sudo cp deploy/apache-voltline-le-ssl.conf /etc/apache2/sites-available/voltline-le-ssl.conf
#   sudo a2ensite voltline-le-ssl     # first install only
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Needs mod_ssl, mod_headers and mod_rewrite.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName voltline.mrballistic.com
    DocumentRoot /var/www/voltline

    ErrorLog  ${APACHE_LOG_DIR}/voltline-error.log
    CustomLog ${APACHE_LOG_DIR}/voltline-access.log combined

    <Directory /var/www/voltline>
        Options -Indexes
        AllowOverride None
        Require all granted
        # No client-side routes, so no SPA fallback: an unknown path is a real
        # 404 (status and all) that serves the 404 page below. A missing
        # hashed bundle or sound therefore also 404s instead of "loading" HTML
        # as a JS module or a sound; the audio loader relies on that status.
        ErrorDocument 404 /404.html
    </Directory>

    # Audio is served with the right MIME types for the browser's decoder.
    AddType audio/webm .webm
    AddType audio/mp4 .m4a

    # Cache rules are chosen by file extension, never by URL alone, so the 404
    # page (served from /404.html) can't pick up a long-lived header.
    #
    # Everything under /assets is a Vite output whose name carries a content
    # hash, so a changed file always has a new name: cache it for a year.
    <FilesMatch "\.(?:js|css|woff2?|svg|png|jpg|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_URI} =~ m#^/assets/#"
    </FilesMatch>
    # Sounds and icons outside /assets keep their names when replaced, so
    # browsers may reuse them for a day and then revalidate (Apache's ETag and
    # Last-Modified make that a 304 when nothing changed).
    <FilesMatch "\.(?:webm|m4a|svg|png|ico)$">
        Header set Cache-Control "public, max-age=86400, must-revalidate" "expr=%{REQUEST_URI} !~ m#^/assets/#"
    </FilesMatch>
    # index.html and 404.html stay uncached so a new deploy is picked up
    # immediately.
    # "always" so the 404 response itself carries the header too.
    <FilesMatch "^(?:index|404)\.html$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Defense-in-depth headers. The CSP matches the desktop (Tauri) app's.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:"

    # certbot manages these.
    SSLCertificateFile /etc/letsencrypt/live/voltline.mrballistic.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/voltline.mrballistic.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
