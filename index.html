<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltline: a neon match-three puzzle game</title>
    <meta name="description" content="Voltline is a free neon match-three puzzle game. Chain Charges, Arcs and Prisms, bank spare pieces in a tray, break through rocks, and watch an AI that plays like a strong human. Play in your browser or get the Mac app." />
    <meta name="author" content="Todd Greco" />
    <meta name="theme-color" content="#0a0a11" />
    <link rel="canonical" href="https://voltline.mrballistic.com/" />
    <!-- Icons: .ico for every browser and tool, SVG where it's understood, PNGs for iOS and the
         manifest. Rendered by scripts/render-favicons.ts. -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Social cards. The image is rendered by scripts/og-image.ts; URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voltline" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://voltline.mrballistic.com/" />
    <meta property="og:title" content="Voltline: a neon match-three puzzle game" />
    <meta property="og:description" content="Chain reactions, a tray of spare pieces, rocks that fight back, and an AI that plays like a strong human. Free in your browser, or as a Mac app." />
    <meta property="og:image" content="https://voltline.mrballistic.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Voltline: a neon board of glowing shapes with lightning forking from a rainbow Prism to every cyan star, beside the V mark and the wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voltline: a neon match-three puzzle game" />
    <meta name="twitter:description" content="Chain reactions, a tray of spare pieces, rocks that fight back, and an AI that plays like a strong human. Free in your browser, or as a Mac app." />
    <meta name="twitter:image" content="https://voltline.mrballistic.com/og-image.png" />
    <meta name="twitter:image:alt" content="Voltline: a neon board of glowing shapes with lightning forking from a rainbow Prism to every cyan star, beside the V mark and the wordmark." />

    <!-- Structured data. A data block, not a script, so the CSP's script-src doesn't apply. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://voltline.mrballistic.com/#website",
            "url": "https://voltline.mrballistic.com/",
            "name": "Voltline",
            "inLanguage": "en",
            "publisher": { "@id": "https://mrballistic.com/#person" }
          },
          {
            "@type": "VideoGame",
            "@id": "https://voltline.mrballistic.com/#game",
            "name": "Voltline",
            "url": "https://voltline.mrballistic.com/",
            "description": "A free neon match-three puzzle game. Chain Charges, Arcs and Prisms, bank spare pieces in a tray, break through rocks, and watch an AI that plays like a strong human.",
            "image": "https://voltline.mrballistic.com/og-image.png",
            "screenshot": "https://voltline.mrballistic.com/og-image.png",
            "genre": ["Puzzle", "Match-three"],
            "playMode": "SinglePlayer",
            "gamePlatform": ["Web browser", "macOS"],
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any modern web browser; macOS 13 or later for the desktop app",
            "downloadUrl": "https://github.com/mrballistic/voltline/releases/latest",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "license": "https://opensource.org/licenses/MIT",
            "sameAs": ["https://github.com/mrballistic/voltline"],
            "author": { "@id": "https://mrballistic.com/#person" },
            "isPartOf": { "@id": "https://voltline.mrballistic.com/#website" }
          },
          {
            "@type": "Person",
            "@id": "https://mrballistic.com/#person",
            "name": "Todd Greco",
            "url": "https://mrballistic.com/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
